<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10051c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg9)"/>
  <circle cx="400" cy="250" r="240" fill="#f99126" opacity="0.1"/>
  <!-- Monitor + Mini PC -->
  <rect x="95" y="75" width="320" height="190" rx="12" fill="#0f172a" stroke="#f99126" stroke-width="3"/>
  <rect x="110" y="90" width="290" height="160" rx="6" fill="#1e1b4b"/>
  <text x="255" y="155" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">TURNKEY POS KIT</text>
  <text x="255" y="182" font-family="monospace" font-size="12" fill="#f99126" text-anchor="middle">PC + MONITOR + PRINTER + DRAWER</text>
  <!-- Caixa Registradora USB embaixo do monitor -->
  <rect x="85" y="290" width="340" height="90" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2.5"/>
  <rect x="120" y="325" width="160" height="12" rx="6" fill="#020617"/>
  <circle cx="375" cy="332" r="12" fill="#22c55e"/>
  <text x="255" y="365" font-family="monospace" font-size="11" fill="#22c55e" text-anchor="middle">CASH DRAWER • USB / RJ11</text>
  <!-- Impressora Térmica 80mm ao lado -->
  <rect x="470" y="135" width="235" height="65" rx="6" fill="#ffffff"/>
  <text x="587" y="172" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">UNRENDER POS 80 MM</text>
  <rect x="450" y="190" width="275" height="190" rx="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="480" y="205" width="215" height="10" rx="5" fill="#020617"/>
  <text x="587" y="295" font-family="sans-serif" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">THERMAL 80 MM</text>
  <text x="587" y="320" font-family="monospace" font-size="11" fill="#f8fafc" text-anchor="middle">AUTO CUTTER • USB/LAN</text>
  <!-- Teclado e Mouse -->
  <rect x="95" y="400" width="280" height="50" rx="8" fill="#334155" stroke="#64748b"/>
  <rect x="395" y="400" width="46" height="50" rx="22" fill="#334155" stroke="#f99126"/>
