<div class="nad" [class.is-ios]="platform === 'ios'" [class.is-android]="platform === 'android'">
  <figure class="phone" role="group"
    [attr.aria-label]="platform === 'ios' ? t('phoneLabelIos') : t('phoneLabelAndroid')">
    <div class="frame">
      <div class="screen">
        <div class="status-bar">
          <span>{{ clock() }}</span>
          <span class="camera" aria-hidden="true"></span>
          <span class="status-icons" aria-hidden="true">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi"></i>
            <i class="fa-solid fa-battery-three-quarters"></i>
          </span>
        </div>

        <header class="app-bar">
          <span class="bar-menu" aria-hidden="true"><i class="fa-solid fa-bars"></i></span>
          <h5 class="app-title">{{ t('appTitle') }}</h5>
          @if (platform === 'ios') {
            <button type="button" class="bar-add" [class.tap]="fabTap" (click)="add()" [attr.aria-label]="t('add')">
              <i class="fa-solid fa-plus" aria-hidden="true"></i>
            </button>
          } @else {
            <span class="avatar" aria-hidden="true">M</span>
          }
        </header>

        <div class="content">
          <div class="hero">
            <b>{{ t('hello') }}</b>
            <span class="hero-text">
              {{ progressText() }}
            </span>
            <span class="meter" aria-hidden="true">
              <span class="meter-fill" [style.transform]="'scaleX(' + ratio + ')'"></span>
            </span>
          </div>

          <div class="section">
            <b>{{ t('today') }}</b>
            <span>{{ t('count', { n: visible.length }) }}</span>
          </div>

          <ul class="tasks">
            @for (task of tasks; track task.id) {
              <li class="task" [class.seed]="task.seed" [class.leaving]="task.leaving">
                <div class="task-clip">
                  <button type="button" class="task-in" [class.done]="task.done" [class.tap]="task.tap"
                    [attr.aria-pressed]="task.done" [attr.aria-label]="t('markDone', { tarefa: t(task.title) })"
                    (click)="toggle(task)">
                    <span class="task-ico" [class.tone-b]="task.tone === 'b'" [class.tone-c]="task.tone === 'c'" aria-hidden="true">
                      <i [class]="task.icon"></i>
                    </span>
                    <span class="task-text">
                      <b>{{ t(task.title) }}</b>
                      <span>{{ t(task.meta) }}</span>
                    </span>
                    <span class="check" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
                  </button>
                </div>
              </li>
            }
          </ul>
        </div>

        @if (platform === 'android') {
          <button type="button" class="add-fab" [class.tap]="fabTap" (click)="add()" [attr.aria-label]="t('add')">
            <i class="fa-solid fa-plus" aria-hidden="true"></i>
          </button>
        }

        <div class="bottom" aria-hidden="true">
          <div class="tabbar">
            @for (tab of tabs; track tab.label; let first = $first) {
              <span class="tab-item" [class.current]="first">
                <span class="tab-ico"><i [class]="tab.icon"></i></span>
                <span class="tab-label">{{ t(tab.label) }}</span>
              </span>
            }
          </div>
          <span class="gesture"></span>
        </div>
      </div>
    </div>
    <figcaption>{{ t('demoTag') }}</figcaption>
  </figure>

  <div class="side">
    <p class="eyebrow">
      <i class="fa-solid fa-mobile-screen-button" aria-hidden="true"></i>
      {{ platform === 'ios' ? t('eyebrowIos') : t('eyebrowAndroid') }}
    </p>
    <h4 class="title">{{ platform === 'ios' ? t('titleIos') : t('titleAndroid') }}</h4>
    <p class="intro">{{ platform === 'ios' ? t('leadIos') : t('leadAndroid') }}</p>
    <ul class="bullets">
      @for (b of bullets; track b.title) {
        <li>
          <span class="bullet-ico" aria-hidden="true"><i [class]="b.icon"></i></span>
          <span>
            <b>{{ t(b.title) }}</b>
            <span>{{ t(b.text) }}</span>
          </span>
        </li>
      }
    </ul>
  </div>
</div>
