<div class="dsd" [class.os-windows]="os === 'windows'" [class.os-macos]="os === 'macos'" [class.os-linux]="os === 'linux'">
  <figure class="monitor" #monitor role="group" [attr.aria-label]="t('monitorLabel')">
    <div class="bezel">
      <div class="screen" #screen>

        <!-- Barra superior (variantes macOS e Linux) -->
        @if (os !== 'windows') {
          <div class="topbar" aria-hidden="true">
            @if (os === 'macos') {
              <span class="top-left">
                <b>SGA CTRLB</b>
                <span class="menu">{{ t('menuFile') }}</span>
                <span class="menu">{{ t('menuEdit') }}</span>
                <span class="menu">{{ t('menuView') }}</span>
                <span class="menu">{{ t('menuWindow') }}</span>
                <span class="menu">{{ t('menuHelp') }}</span>
              </span>
              <span class="top-right">
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>{{ day() }} {{ clock() }}</span>
              </span>
            } @else {
              <span class="top-left"><b>{{ t('activities') }}</b></span>
              <span class="top-center">{{ day() }} {{ clock() }}</span>
              <span class="top-right">
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-volume-high"></i>
                <i class="fa-solid fa-battery-full"></i>
              </span>
            }
          </div>
        }

        <!-- Ícone da área de trabalho -->
        <button type="button" class="desk-icon" (click)="openWindow()" [attr.aria-label]="t('openApp')">
          <span class="desk-icon-img"><img src="/ctrlb-logo.png" alt="" /></span>
          <span class="desk-icon-name">SGA CTRLB</span>
        </button>
        <p class="closed-hint" [class.shown]="!isWindowOpen">{{ t('closedHint') }}</p>

        <!-- Janela do sistema, com as capturas reais -->
        <div class="win" #win [class.is-closed]="!isWindowOpen" [class.is-min]="isMinimized" [class.is-max]="isMaximized"
          [class.is-dragging]="dragging" [attr.inert]="!isWindowOpen || isMinimized ? '' : null">
          <div class="titlebar" (pointerdown)="startDrag($event)">
            <span class="win-app">
              <img src="/ctrlb-logo.png" alt="" />
              <span>SGA CTRLB · {{ t(screens[active].label) }}</span>
            </span>
            <span class="win-ctrls">
              <button type="button" class="wc wc-min" (click)="minimizeWindow()" [attr.aria-label]="t('winMin')">
                <i class="fa-solid fa-minus" aria-hidden="true"></i>
              </button>
              <button type="button" class="wc wc-max" (click)="toggleMaximize()"
                [attr.aria-label]="isMaximized ? t('winRestore') : t('winMax')">
                <i [class]="isMaximized ? 'fa-regular fa-clone' : 'fa-regular fa-square'" aria-hidden="true"></i>
              </button>
              <button type="button" class="wc wc-close" (click)="closeWindow()" [attr.aria-label]="t('winClose')">
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
              </button>
            </span>
          </div>

          <div class="screens" role="tablist" [attr.aria-label]="t('screensLabel')">
            @for (s of screens; track s.key; let i = $index) {
              <button type="button" role="tab" class="screen-tab" [class.current]="active === i"
                [attr.aria-selected]="active === i" (click)="select(i)">
                <i [class]="s.icon" aria-hidden="true"></i>
                <span>{{ t(s.label) }}</span>
              </button>
            }
          </div>

          <div class="view">
            <div class="shots">
              @for (s of screens; track s.key; let i = $index) {
                @if (loaded.has(i)) {
                  <img class="shot" [class.current]="active === i" [src]="src(s.file)" [alt]="t(s.alt)"
                    [attr.aria-hidden]="active !== i" width="1440" height="900" decoding="async" />
                }
              }
            </div>
          </div>
        </div>

        <!-- Barra de tarefas / dock genéricos (ícones neutros, sem marcas) -->
        <div class="dock">
          <span class="dock-ico dock-start" aria-hidden="true"><i class="fa-solid fa-grip"></i></span>
          <span class="dock-ico dock-search" aria-hidden="true"><i class="fa-solid fa-magnifying-glass"></i></span>
          <span class="dock-ico" aria-hidden="true"><i class="fa-solid fa-folder"></i></span>
          <button type="button" class="dock-app" [class.running]="isWindowOpen" (click)="restoreWindow()"
            [attr.aria-label]="t('openApp')">
            <img src="/ctrlb-logo.png" alt="" />
          </button>
          <span class="dock-ico" aria-hidden="true"><i class="fa-solid fa-globe"></i></span>
          <span class="dock-ico dock-term" aria-hidden="true"><i class="fa-solid fa-terminal"></i></span>
          @if (os === 'windows') {
            <span class="tray" aria-hidden="true">
              <i class="fa-solid fa-wifi"></i>
              <i class="fa-solid fa-volume-high"></i>
              <span class="tray-clock"><span>{{ clock() }}</span><span>{{ day() }}</span></span>
            </span>
          }
        </div>

        <button type="button" class="logo-overlay" [class.shown]="showCtrlBImage" [attr.inert]="showCtrlBImage ? null : ''"
          (click)="showCtrlBImage = false" [attr.aria-label]="t('winClose')">
          <img src="/ctrlb-logo.png" [alt]="t('logoAlt')" />
        </button>
      </div>
    </div>
    <div class="stand" aria-hidden="true"></div>
    <figcaption>
      <i class="fa-solid fa-camera" aria-hidden="true"></i> {{ t('caption') }}
    </figcaption>
  </figure>

  <div class="about">
    <p class="eyebrow"><i class="fa-solid fa-desktop" aria-hidden="true"></i> {{ stack[os] }}</p>
    <p class="intro">{{ t('lead') }}</p>
    <ul class="native">
      <li>
        <span class="native-ico" aria-hidden="true"><i class="fa-solid fa-print"></i></span>
        <span><b>{{ t('hwTitle') }}</b><span>{{ t('hwText') }}</span></span>
      </li>
      <li>
        <span class="native-ico" aria-hidden="true"><i class="fa-solid fa-code"></i></span>
        <span><b>{{ t('nativeTitle') }}</b><span>{{ t(nativeKey) }}</span></span>
      </li>
      <li>
        <span class="native-ico" aria-hidden="true"><i class="fa-solid fa-arrows-rotate"></i></span>
        <span><b>{{ t('updTitle') }}</b><span>{{ t('updText') }}</span></span>
      </li>
    </ul>
  </div>
</div>
