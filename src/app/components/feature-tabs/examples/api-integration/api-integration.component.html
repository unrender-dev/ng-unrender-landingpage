<div class="api-wrap">
  <div class="api-card" [class.is-paused]="paused()">
    <div class="api-viz" role="group" [attr.aria-label]="t('vizLabel')">
      <!-- Linhas e pulsos: viewBox 100×100 acompanha o quadrado do contêiner -->
      <svg class="api-links" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        @for (node of integrations(); track node.id) {
          <g class="api-link" [class.is-off]="!node.connected">
            <line class="api-line-base" [attr.x1]="centerX" [attr.y1]="centerY" [attr.x2]="node.x" [attr.y2]="node.y" />
            <line class="api-line-live" [attr.x1]="centerX" [attr.y1]="centerY" [attr.x2]="node.x" [attr.y2]="node.y" />
            <g
              class="api-flow"
              [style.--dx]="node.x - centerX"
              [style.--dy]="node.y - centerY"
              [style.--delay]="node.delay">
              <circle class="api-packet api-packet-out" [attr.cx]="centerX" [attr.cy]="centerY" r="1.3" />
              <circle class="api-packet api-packet-in" [attr.cx]="centerX" [attr.cy]="centerY" r="1.3" />
            </g>
          </g>
        }
      </svg>

      <div class="api-hub" [style.left.%]="centerX" [style.top.%]="centerY">
        <span class="api-hub-pulse" aria-hidden="true"></span>
        <span class="api-hub-pulse api-hub-pulse-late" aria-hidden="true"></span>
        <span class="api-hub-core" aria-hidden="true"><fa-icon [icon]="faPlug"></fa-icon></span>
        <span class="api-hub-label">{{ t('hub') }}</span>
      </div>

      @for (node of integrations(); track node.id) {
        <button
          type="button"
          class="api-node"
          [class.is-off]="!node.connected"
          [class.is-burst]="node.burst"
          [style.left.%]="node.x"
          [style.top.%]="node.y"
          [attr.aria-pressed]="node.connected"
          [attr.aria-label]="ariaLabel(node)"
          (click)="toggleConnection(node)">
          <span class="api-node-icon">
            <fa-icon [icon]="node.icon" aria-hidden="true"></fa-icon>
            <span class="api-node-dot" aria-hidden="true"></span>
          </span>
          <span class="api-node-label"><span>{{ label(node) }}</span></span>
        </button>
      }
    </div>

    <div class="api-info">
      <span class="api-demo">{{ t('demoNote') }}</span>
      <h3>{{ t('title') }}</h3>
      <p>{{ t('text') }}</p>

      <div class="api-status">
        <span class="api-status-dot" aria-hidden="true"></span>
        {{ t('activeCount', { n: activeCount(), total: integrations().length }) }}
      </div>

      <ul class="api-tags" [attr.aria-label]="t('protocols')">
        @for (p of protocols; track p) {
          <li>{{ p }}</li>
        }
      </ul>

      <p class="api-hint">{{ t('hint') }}</p>
    </div>
  </div>
</div>
