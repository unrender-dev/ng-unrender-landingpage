<section class="bi" [class.is-compact]="compact()" [class.is-paused]="!running()">
  <header class="bi-head">
    <p class="bi-eyebrow">
      <fa-icon [icon]="faCircleCheck" aria-hidden="true"></fa-icon>
      {{ t('eyebrow') }}
    </p>
    <h3>{{ t('title') }}</h3>
    <p class="bi-intro">{{ t('intro') }}</p>
  </header>

  <div class="bi-tabs" role="tablist" [attr.aria-label]="t('tabsLabel')">
    @for (s of slides; track s.id; let i = $index) {
      <button
        type="button"
        role="tab"
        class="bi-tab"
        [id]="'bi-tab-' + s.id"
        [class.is-active]="active() === i"
        [attr.aria-selected]="active() === i"
        [attr.aria-controls]="'bi-panel-' + s.id"
        [attr.tabindex]="active() === i ? 0 : -1"
        (click)="select(i)"
        (keydown)="onTabKey($event, i)">
        <fa-icon [icon]="s.icon" aria-hidden="true"></fa-icon>
        <span class="bi-tab-label">{{ t(s.tab) }}</span>
        @if (active() === i) {
          @for (k of [cycle()]; track k) {
            <span class="bi-progress" [style.animation-duration.ms]="dwell()" aria-hidden="true"></span>
          }
        }
      </button>
    }
  </div>

  <figure class="bi-window">
    <div class="bi-bar">
      <span class="bi-dots" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="bi-bar-title" aria-hidden="true">{{ t('windowTitle') }} · {{ t(slides[active()].tab) }}</span>
      <button
        type="button"
        class="bi-toggle"
        (click)="togglePlay()"
        [attr.aria-label]="t(userPaused() ? 'play' : 'pause')"
        [title]="t(userPaused() ? 'play' : 'pause')">
        <fa-icon [icon]="userPaused() ? faPlay : faPause" aria-hidden="true"></fa-icon>
      </button>
    </div>

    <!-- As três capturas ficam empilhadas: trocar de tela é só opacidade, sem recriar nós -->
    <div class="bi-screen">
      @for (s of slides; track s.id; let i = $index) {
        <div
          class="bi-slide"
          role="tabpanel"
          [id]="'bi-panel-' + s.id"
          [attr.aria-labelledby]="'bi-tab-' + s.id"
          [attr.aria-hidden]="active() !== i"
          [class.is-active]="active() === i"
          [class.is-zoomed]="zoomed() === i"
          [style.--ox]="focus(s).ox + '%'"
          [style.--oy]="focus(s).oy + '%'"
          [style.--zoom]="focus(s).zoom">
          <img
            [src]="s.src"
            [alt]="t(s.alt)"
            width="1440"
            height="900"
            [attr.loading]="i === 0 ? 'eager' : 'lazy'"
            decoding="async">
          <span
            class="bi-spot"
            aria-hidden="true"
            [style.left.%]="s.spot.l"
            [style.top.%]="s.spot.t"
            [style.width.%]="s.spot.w"
            [style.height.%]="s.spot.h">
            <span class="bi-spot-label">{{ t(s.spotLabel) }}</span>
          </span>
        </div>
      }
    </div>

    <!-- Legendas na mesma célula do grid: a altura é a da maior, então nada pula na troca -->
    <figcaption class="bi-captions">
      @for (s of slides; track s.id; let i = $index) {
        <div class="bi-caption" [class.is-active]="active() === i" [attr.aria-hidden]="active() !== i">
          <h4>{{ t(s.title) }}</h4>
          <p>{{ t(s.text) }}</p>
        </div>
      }
    </figcaption>
  </figure>

  <p class="bi-note">{{ t(i18n.lang() === 'pt' ? 'realNote' : 'realNoteLang') }}</p>
</section>
