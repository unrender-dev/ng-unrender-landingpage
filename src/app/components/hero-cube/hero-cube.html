<!-- Cena 3D decorativa: o conteúdo do herói é o texto abaixo. -->
<canvas #canvas class="hero-canvas" aria-hidden="true"></canvas>
<div class="hero-text">
  <div class="hero-badge">{{ t('badge') }}</div>
  <h1 class="hero-title">
    <span class="text-unrender-accent">{{ t('h1_a') }}</span><br />
    {{ t('h1_b') }}<br />
    <span class="text-unrender-accent">{{ t('h1_c') }}</span>{{ t('h1_end') }}
  </h1>
  <div class="hero-lines">
    <p>{{ t('line_1') }}</p>
    <p>{{ t('line_2') }}</p>
    <p>{{ t('line_3') }}</p>
  </div>
</div>
